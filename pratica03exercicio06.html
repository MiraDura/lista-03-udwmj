<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juros Compostos</title>
  <link rel="stylesheet" href="pratica03exercicio06.css">
  <script src="pratica03exercicio06.js" defer></script>
</head>
<body>
  <main class="card">
    <p class="numero">Exercício 3</p>
    <h1>Juros Compostos</h1>
    <p>A taxa e o prazo devem usar a mesma unidade de tempo.</p>
    <label for="capital">Capital inicial (R$)</label>
    <input type="number" id="capital" min="0" step="0.01" placeholder="Ex.: 1000">
    <label for="taxa">Taxa de juros (%)</label>
    <input type="number" id="taxa" min="0" step="any" placeholder="Ex.: 2">
    <label for="tempo">Prazo</label>
    <input type="number" id="tempo" min="0" step="1" placeholder="Ex.: 12">
    <button type="button" onclick="calcularMontante()">Calcular montante</button>
    <div id="resultado" class="resultado" aria-live="polite">O resultado aparecerá aqui.</div>
    <a href="index.html">← Voltar ao início</a>
  </main>
</body>
</html>
